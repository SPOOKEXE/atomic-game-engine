# Render hook registry. This is the file to edit.
#
# `just render-hooks` writes docs/engine/RENDER_HOOKS.md from this file plus the
# limits in DataFactoryHookBind.hpp. `just render-hooks-check` fails when the
# page is stale or when a hook registered in code is missing here (or the
# reverse).
#
# [[hook]]      one registered hook: stable name, kind, where it is registered,
#               where it runs, and what it is for.
# [[rule]]      a contract every hook keeps.
# [[planned]]   render cleanup still owed after the hook work.

[owner]
type = "DataFactoryHookBind"
header = "mono.engine/render/include/engine/render/capture/DataFactoryHookBind.hpp"
source = "mono.engine/render/src/capture/DataFactoryHookBind.cpp"
tests = "mono.engine/render/tests/capture/DataFactoryHookBind.cpp"
bench = "just data-capture-hook-bench 5"
adapters = [
	"mono.engine/render/src/capture/ScriptDataCaptureBridge.cpp",
]
summary = """
One owner for hook registration, session connections, pending batches, completed
bundles, generation-checked handles, budgets and teardown. Hooks run at static
render graph seams. There is no callback graph and no user code on a render
thread. Stable names are the contract for discovery, manifests, logs and MCP;
enum values and slot indices are process-local and never saved.
"""

[[hook]]
name = "data_capture.<channel>"
kind = "data_capture"
access = "async_observation"
node_kind = "capture"
registered = "DataFactoryHookBind::RegisterBuiltInDataCaptureHooks"
admitted = "mono.engine/render/src/capture/ScriptDataCaptureBridge.cpp (ArmDataCapture, CallHooks)"
observed = "mono.engine/render/src/nodes/OutputNodes.cpp (Observe at the derived capture node)"
collected = "DataFactoryHookBind::Pump, TakeCompleted"
summary = """
One hook per capture channel. A connection names the authored base node and
`DataCaptureNode` derives the channel node. The node freezes an owned
`RenderObservationContext` and queues a `ResourceImage` readback; `Pump`
publishes a bundle only when every required plane agrees on world, snapshot,
frame, pipeline revision, view slot, camera, crop and dimensions.
"""
