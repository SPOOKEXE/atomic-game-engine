[[hook]]
name = "view.camera"
kind = "view_mutation"
access = "synchronous_mutation"
node_kind = "view"
registered = "DataFactoryHookBind::RegisterBuiltInViewMutationHooks"
admitted = "DataFactoryHookBind::ArmViewMutation"
observed = "mono.engine/render/src/presentation/FrameBatch.cpp (ConsumeViewMutation before RenderView)"
collected = "DataFactoryHookBind::PollViewMutation, ReleaseViewMutation"
mutates = ["camera_frame", "camera", "projection"]
summary = """
One-shot owned patch for one exact world, snapshot, pipeline revision and view
slot. The renderer copies the caller view, applies the patch, forces camera
damage and leaves the caller view unchanged. The next matching submission
restores the original view; only a successful submission reports `applied`.
"""

[[rule]]
title = "Owned values only"
body = "Contexts and bundles hold names and values. No world, renderer, texture, command buffer, ECS row or callback pointer enters them."

[[rule]]
title = "No waiting"
body = "A hook never waits for a GPU fence or another thread. Readback is queued; Pump only checks completed work."

[[rule]]
title = "Atomic connect and bundles"
body = "ConnectHooks validates the whole set before changing anything. A failed required hook fails the whole bundle; partial bytes are never presented as success."

[[rule]]
title = "Bounded and visible backpressure"
body = "All limits are fixed constants. A full budget returns Capacity or Backpressured and changes no ownership. Pending work past the pump bound becomes a terminal failure."

[[rule]]
title = "Generation handles"
body = "Handles are {slot, generation}. A released slot bumps its generation, so a stale handle cannot touch a new object."

[[rule]]
title = "Teardown order"
body = "Close the connection, cancel pending readback tokens, drop completed bundles, release scratch, invalidate the generation. World teardown and renderer shutdown do the same."

[[rule]]
title = "Saving is outside"
body = "The binder returns owned records. The external data factory saves payloads, verifies hashes and commits the manifest last."

[[rule]]
title = "Second consumer first"
body = "No physics or replication hooks until a second real render consumer has proven which parts should be shared."

[[planned]]
title = "Split ViewRecording by lifetime"
body = "ViewInput (caller data), PreparedView (camera, scene plan, targets, capture decisions) and RecordingState (command identity, pass state, history, outcome). Delete each old field as it moves. One authoritative owner per persistent resource."

[[planned]]
title = "One surface frontier"
body = "SurfaceCapturePlan becomes the only mirror and portal expansion plan: a bounded depth-first stack (enter, child, record, leave) keeping child-before-parent recording. Route MirrorNodes and PortalNodes through it, then delete the recursive recorders once image fixtures and target-reuse traces pass."
