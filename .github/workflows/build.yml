# Builds the `release` preset on every platform and, for a v* tag, publishes
# what it built.
#
# One file rather than a CI workflow and a release workflow, because the two
# would differ only in their last job and the build half is the expensive half -
# splitting it means either duplicating sixty lines or reaching for a reusable
# workflow to avoid duplicating them. See docs/RELEASING.md.
#
# Deliberately not on branch pushes and not on pull_request. A full build from
# a cold clone is close to an hour on a hosted runner - shaderc, SDL, Luau,
# QuickJS and Crypto++ all compile from source - and `.githooks/pre-push`
# already runs the whole of `just preset=ci check` before anything leaves a
# contributor's machine. A branch push would rebuild, remotely and slowly, what
# the hook just verified locally. Tags publish releases, and
# `workflow_dispatch` is the dry run that builds and uploads artifacts without
# publishing anything. Cheap checks belong in a separate workflow that does not
# configure a client.
#
# So the only refs that start this are a `v*.*.*` tag and a human pressing the
# button. Pushing a commit, to any branch, builds nothing anywhere but here.

name: build

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

# One run per ref, so a re-run cancels the attempt it replaces rather than
# racing it.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One place decides what the artifacts are called, so a mismatch between the
  # tag and the version compiled into the binaries is caught before an hour of
  # build time rather than after it.
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.pick.outputs.version }}
      release: ${{ steps.pick.outputs.release }}
      prerelease: ${{ steps.pick.outputs.prerelease }}
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - id: pick
        run: |
          set -euo pipefail

          # The declared version, from the one file that holds it. CMakeLists.txt
          # reads the same file for `project(VERSION)`, and `engine::core::Version()`
          # is compiled from that - so the number here, the number in the
          # artifact names and the number `client --version` prints cannot
          # disagree without somebody editing this file.
          declared=$(tr -d '[:space:]' < VERSION)
          if ! printf '%s' "$declared" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "VERSION holds '$declared', which is not major.minor.patch." >&2
            exit 1
          fi

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tagged=${GITHUB_REF_NAME#v}
            if [ "$tagged" != "$declared" ]; then
              echo "tag ${GITHUB_REF_NAME} does not match VERSION, which says $declared." >&2
              echo "  Bump VERSION in the same commit the tag points at." >&2
              exit 1
            fi
            version=$declared
            release=true
          else
            # Not a release, and the name says so rather than colliding with
            # the tagged artifact of the same version.
            version="$declared+$(git rev-parse --short HEAD)"
            release=false
          fi

          # Everything before 1.0.0 is a pre-release and GitHub should say so.
          case $version in
            0.*) prerelease=true ;;
            *)   prerelease=false ;;
          esac

          # **The build matrix is decided here, because a job cannot decide it
          # for itself.** `jobs.<id>.if` cannot see the `matrix` context - only
          # a step can - so "build the dev flavour on a tag and not on a manual
          # run" has to be a matrix that is shorter on a manual run. It is
          # written out rather than filtered, because a two-entry list twice is
          # shorter than the expression that would trim one.
          #
          # `dev` is the same tree from the `dist-dev` preset: -O1, heap
          # profiler compiled in. It doubles an hour-long matrix, which is why
          # it runs for a tag only - a manual run publishes nothing.
          shipped='
            {"platform":"linux-x86_64","runner":"ubuntu-24.04","optional":false,"flavour":"release","preset":"release"},
            {"platform":"windows-x86_64","runner":"windows-2022","optional":true,"flavour":"release","preset":"release"},
            {"platform":"macos-arm64","runner":"macos-14","optional":true,"flavour":"release","preset":"release"}'
          diagnostic='
            {"platform":"linux-x86_64","runner":"ubuntu-24.04","optional":false,"flavour":"dev","preset":"dist-dev"},
            {"platform":"windows-x86_64","runner":"windows-2022","optional":true,"flavour":"dev","preset":"dist-dev"},
            {"platform":"macos-arm64","runner":"macos-14","optional":true,"flavour":"dev","preset":"dist-dev"}'

          if [ "$release" = true ]; then
            matrix="{\"include\":[$shipped,$diagnostic]}"
          else
            matrix="{\"include\":[$shipped]}"
          fi
          matrix=$(printf '%s' "$matrix" | tr -d '\n' | tr -s ' ')

          echo "version=$version"       >> "$GITHUB_OUTPUT"
          echo "release=$release"       >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix"         >> "$GITHUB_OUTPUT"
          echo "building $version (release=$release)"
          echo "$matrix"

  build:
    needs: version
    name: ${{ matrix.platform }} ${{ matrix.flavour }}
    runs-on: ${{ matrix.runner }}
    # Linux is the platform this engine is developed on and its failure is a
    # real failure. Windows compiles but has never shipped, and macOS has never
    # been run at all - CMakeLists.txt warns as much when it configures. Neither
    # gets to hold up a Linux release; both upload what they manage to build.
    continue-on-error: ${{ matrix.optional }}
    timeout-minutes: 180

    strategy:
      fail-fast: false
      # Decided by the `version` job. See the comment there: a job-level `if`
      # cannot read the `matrix` context, so the flavour that only ships with a
      # tag is expressed as a matrix with fewer entries rather than as a
      # condition on the job.
      matrix: ${{ fromJSON(needs.version.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # shaderc pins glslang, SPIRV-Tools and SPIRV-Headers in its own DEPS file
      # rather than as submodules, so the checkout above leaves its third_party/
      # empty and the client configure stops in MonoVendor.cmake. Same step
      # `just setup` runs, and for the same reason.
      - name: Fetch shaderc dependencies
        if: runner.os != 'Windows'
        run: python3 mono.vendor/shaderc/utils/git-sync-deps

      # The same step, and it is a separate one only because `python3` is not a
      # name that resolves on a Windows runner. The shim of that name there is
      # the Microsoft Store stub, which exits without doing anything and leaves
      # third_party/ empty exactly as if the step had been skipped - a configure
      # failure several minutes later with nothing pointing back here. `python`
      # is the interpreter the runner image installs.
      - name: Fetch shaderc dependencies
        if: runner.os == 'Windows'
        shell: cmd
        run: python mono.vendor\shaderc\utils\git-sync-deps

      # SDL picks its backends at configure time from what it finds. A runner
      # without these produces a client that builds and then opens no window,
      # which is a failure a long way from its cause.
      #
      # **Nine X11 components are a hard error rather than a missing backend**,
      # and `sdlchecks.cmake` calls `SDL_missing_dependency` for each: XCURSOR,
      # XDBE, XINPUT, XFIXES, XSYNC, XRANDR, XSCRNSAVER, XSHAPE and XTEST. Every
      # one but the last is covered by a package already listed here - Xdbe,
      # XSync and XShape all live in libxext - so `libxtst-dev` is the only name
      # that has to appear for its own sake, and without it the configure stops
      # at "Couldn't find dependency package for XTEST" after a hundred
      # successful feature checks.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxkbcommon-dev libxtst-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libibus-1.0-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ninja ccache
          scripts/fetch-moltenvk.sh

      # The pinned TypeScript, and it is not optional here even though the build
      # treats it as optional.
      #
      # `Mirrors-1-world.ts` and `Mirrors-4-worlds.ts` are transpiled to
      # JavaScript during the build and staged as example scenes. A missing
      # `node_modules/.bin/tsc` is not fatal - mono.engine/examples/CMakeLists.txt
      # prints one STATUS line and skips them - so a runner without this step
      # produces a green build and a release quietly short two scenes, which is
      # the failure nobody notices. `node_modules/` is gitignored, so without an
      # install step that is every run.
      #
      # `install` rather than `ci`: package.json pins typescript to an exact
      # version and there is no package-lock.json to honour. The repository's
      # bun.lock is for `bun`, and npm is what every runner image already has.
      - name: Install the TypeScript transpiler
        shell: bash
        run: npm install --no-audit --no-fund

      # **A cold build here is 3508 CPU-seconds and a warm one is 197.** The
      # compiler cache is wired in `CMakeLists.txt` and used automatically once
      # `ccache` is on PATH, which the dependency steps above now arrange - but
      # a runner is a fresh machine every time, so without somewhere to keep the
      # cache between runs every CI build is the cold number.
      #
      # **`actions/cache` rather than a marketplace ccache action**, for the
      # reason the Windows build step gives about vcvars: a first-party
      # mechanism whose behaviour is written down here beats one whose is
      # written down somewhere else.
      #
      # The key carries the run's own SHA so every run writes a fresh entry, and
      # `restore-keys` falls back to the most recent entry for this platform.
      # That is the standard rolling-cache shape: an exact hit never happens and
      # is not meant to, because the point is to start from whatever the last
      # build left behind.
      #
      # **Not Windows.** ccache does work with MSVC, but only where debug info
      # is `/Z7` rather than `/Zi`, and this workflow's own comments record that
      # the Windows build compiles and has never shipped. Adding a caching layer
      # with a compiler-flag precondition to the one platform nobody runs is how
      # an optional build becomes a flaky one.
      # **Pinned rather than left to ccache's default, because the default is not
      # the same path on every runner.** ccache resolves its directory from
      # `XDG_CACHE_HOME` on Linux and from `~/Library/Caches` on macOS, and a
      # `path:` below that named the wrong one would restore nothing, report
      # nothing, and look exactly like a cache that was simply cold. One name,
      # set here, used by the cache step and by ccache alike.
      #
      # It is also where `--set-config` writes, so the settings below travel
      # with the cache rather than living on a machine that is deleted at the
      # end of the job.
      #
      # `RUNNER_TEMP` rather than a path under the checkout or one reached with
      # `..`: it is absolute on every runner, it is not somewhere
      # `actions/checkout` will clean, and `actions/cache` globs its `path:` -
      # so a `..` in one is a thing that may or may not resolve depending on the
      # version.
      #
      # **A step rather than the job's `env:`, because the `runner` context does
      # not exist there.** `jobs.<id>.env` may only read `github`, `needs`,
      # `strategy`, `matrix`, `vars`, `inputs` and `secrets`; a `runner` in it
      # is not a value that comes out empty, it is a file GitHub refuses to
      # parse, and the whole workflow fails in zero seconds saying only
      # "workflow file issue". The `$RUNNER_TEMP` variable is the same value and
      # is readable in any step.
      - name: Pin the compiler cache directory
        if: runner.os != 'Windows'
        shell: bash
        run: echo "CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"

      # **Keyed by flavour as well as platform.** The two flavours compile the
      # same files with different flags, so they share no objects; one key for
      # both would be two builds evicting each other's entries all day and
      # reporting a hit rate that never recovers.
      - name: Restore the compiler cache
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ matrix.platform }}-${{ matrix.flavour }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.platform }}-${{ matrix.flavour }}-

      # `content` rather than the default `mtime`: a runner checks out fresh
      # every time, so a compiler's mtime says nothing about whether it is the
      # same compiler. Hashing it costs once per run.
      #
      # 2 GiB per platform against GitHub's 10 GiB per-repository ceiling, which
      # three platforms and a little churn have to fit inside. One preset
      # measured 0.7 GiB, so this is headroom rather than a limit anything
      # reaches - and a cache that silently began evicting would show up below
      # as a hit rate that fell and stayed fallen.
      - name: Configure the compiler cache
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ccache --set-config max_size=2G
          ccache --set-config compiler_check=content
          ccache --zero-stats

      - name: Build
        if: runner.os != 'Windows'
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }}

      # **Always, and not only on failure.** A cache that stopped being used is
      # indistinguishable from one that never was, which is the argument
      # `CMakeLists.txt` makes where it reports an absent cache rather than
      # staying quiet. A hit rate that falls to zero and stays there is a
      # regression worth seeing in a green build.
      - name: What the compiler cache did
        if: runner.os != 'Windows'
        continue-on-error: true
        shell: bash
        run: ccache --show-stats --verbose

      # The repository's own Windows entry point rather than a marketplace
      # action that sets the same variables. Every preset generates for Ninja,
      # Ninja has no per-command environment, and MSVC reads its include and
      # library paths from INCLUDE and LIB - so the build needs vcvars64 to have
      # run in the same shell. scripts/build-windows.bat finds Visual Studio and
      # runs it, which is the path a contributor on Windows already uses.
      - name: Build
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set PRESET=${{ matrix.preset }}
          scripts\build-windows.bat

      # **Why a build failed, when the machine that failed is not one anybody can
      # log into.** CMake records every `try_compile` it ran - the source, the
      # command line and the compiler's own output - in a configure log, and
      # nothing else does. The Windows build spent three rounds being diagnosed
      # from a `#error` sixty files downstream of the check that actually failed,
      # because that file is the one thing the runner never kept.
      #
      # `if: failure()` so a green build says nothing, and `continue-on-error` so
      # a missing log never turns a build failure into two.
      - name: What the configure decided
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          set -u
          root=.cache/build/${{ matrix.preset }}/CMakeFiles
          for name in CMakeConfigureLog.yaml CMakeError.log CMakeOutput.log; do
            if [ -f "$root/$name" ]; then
              echo "===== $root/$name ====="
              # Capped: the configure log carries every probe and runs to
              # megabytes, and the first failure is the one that matters.
              head -c 400000 "$root/$name"
              echo
            fi
          done
          sdl=.cache/build/${{ matrix.preset }}/mono.vendor/sdl/CMakeFiles
          for name in CMakeError.log CMakeOutput.log; do
            if [ -f "$sdl/$name" ]; then
              echo "===== $sdl/$name ====="
              head -c 200000 "$sdl/$name"
              echo
            fi
          done

      - name: Package
        shell: bash
        run: |
          scripts/package-release.sh \
            .cache/build/${{ matrix.preset }} \
            "${{ needs.version.outputs.version }}" \
            "${{ matrix.platform }}" \
            dist \
            "${{ matrix.flavour == 'dev' && 'dev' || '' }}"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}-${{ matrix.flavour }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Whatever the platforms managed to produce. `build` is allowed to fail on
      # Windows and macOS, so this runs on their partial results rather than
      # waiting for a green that a two-platform-unproven engine cannot give yet.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      # These are platform-independent API dumps. Add them once at the publish
      # boundary rather than making all six matrix jobs upload colliding copies.
      - name: Include API schema dumps
        run: |
          cp docs/schema.toml dist/schema.toml
          cp docs/schema-data.toml dist/schema-data.toml

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la dist
          # Upload replaces rather than appends, and an existing release is
          # uploaded into rather than fatal: this job re-runs after a failure,
          # and a tag moved onto a fixed commit leaves its old release behind.
          # Creating twice would fail the second attempt over work the first
          # already did.
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber \
              dist/*
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --verify-tag \
              --generate-notes \
              ${{ needs.version.outputs.prerelease == 'true' && '--prerelease' || '' }} \
              dist/*
          fi
